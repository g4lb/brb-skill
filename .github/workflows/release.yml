name: Release

# Manual only. Verifies a tagged version and builds the release archive as a
# workflow artifact. It does not create the GitHub release: a maintainer does
# that from their own account (see docs/release.md), so releases are authored
# by the maintainer, not by github-actions[bot].
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match package.json, e.g. 1.0.1)
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Check out the tag itself, so the archive is built from the tagged commit
      # whichever ref the workflow was started from.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.name CI && git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm run check
      - name: Version matches input
        run: test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"
      - name: Checked-out commit is the tagged commit
        run: |
          # --force: checkout stores an annotated tag as a plain ref, and a fetch without it fails with "would clobber existing tag".
          git fetch --force --quiet origin "+refs/tags/v${{ inputs.version }}:refs/tags/v${{ inputs.version }}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "v${{ inputs.version }}^{commit}")" \
            || { echo "HEAD is not the commit tagged v${{ inputs.version }}"; exit 1; }
      - name: Build release archive
        run: |
          npm pack
          mv brb-claude-code-${{ inputs.version }}.tgz brb-${{ inputs.version }}.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: brb-${{ inputs.version }}
          path: brb-${{ inputs.version }}.tgz
          if-no-files-found: error
