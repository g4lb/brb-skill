name: Release

# Manual only. Builds, verifies and drafts a GitHub release; a maintainer publishes it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match package.json, e.g. 1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.name CI && git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm run check
      - name: Version matches input
        run: test "$(node -p "require('./package.json').version")" = "${{ inputs.version }}"
      - name: Build release archive
        run: |
          npm pack
          mv brb-claude-code-${{ inputs.version }}.tgz brb-${{ inputs.version }}.tgz
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" brb-${{ inputs.version }}.tgz \
            --draft --title "BRB v${{ inputs.version }}" \
            --notes "See CHANGELOG.md for details."
